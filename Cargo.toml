[package]
name = "noders"
version = "0.1.45"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
aerion = { git = "https://github.com/MoeclubM/Aerion.git", rev = "8b8d9f7bb6f575828c79fd91167fa70d89002599" }
base64 = "0.22.1"
boring = "5.3.0"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12.1"
libc = "0.2.191"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
percent-encoding = "2.3.2"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "test-util", "io-util"] }

[profile.test]
debug = 0
